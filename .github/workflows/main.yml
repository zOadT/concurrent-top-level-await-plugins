name: CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "**"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@v1.17.0
        with:
          node-version: "24"
          cache: true

      - name: Install
        run: vp install --frozen-lockfile

      - name: Check
        run: vp check

      - name: Test
        run: vp test

      - name: Build
        run: vp run build
